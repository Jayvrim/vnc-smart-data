<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interswitch Payment Gateway – Inline Checkout</title>
  <style>
    :root {
      --brand: #0056b3;
      --brand-dark: #003d80;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #059669;
      --failure: #dc2626;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      color: var(--text);
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.12);
    }

    .hint {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--brand);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      background: var(--brand-dark);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-line;
    }

    .alert.success {
      background: #d1fae5;
      color: var(--success);
      border: 1px solid #a7f3d0;
    }

    .alert.failure {
      background: #fee2e2;
      color: var(--failure);
      border: 1px solid #fecaca;
    }

    .alert.info {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <header>
        <h1>IPG Inline Checkout</h1>
        <p class="subtitle">Enter an amount and click Pay to test the Interswitch Web Checkout.</p>
      </header>

      <form id="paymentForm">
        <div class="form-group">
          <label for="amount">Amount (₦)</label>
          <input id="amount" type="number" min="1" step="0.01" placeholder="e.g. 10.00" required />
          <span class="hint">
            Amount is sent in kobo (minor denomination). ₦10 = 1000.
          </span>
        </div>

        <button type="submit" id="payButton">Pay</button>
      </form>

      <div id="messageBox" class="alert info" style="display: none;"></div>
      <div id="resultBox" style="display: none;"></div>
    </div>

    <footer>
      Interswitch Payment Gateway Web Checkout guide.
    </footer>
  </div>

  <script>
    // Test credentials from the IPG Web Checkout guide.
    const TEST_MERCHANT_CODE = 'MX153376';
    const TEST_PAY_ITEM_ID = '9381029';
    const TEST_CURRENCY = 566; // ISO 4217 numeric code for NGN.
    const ISW_SCRIPT_URL = 'https://newwebpay.interswitchng.com/inline-checkout.js';

    const params = new URLSearchParams(window.location.search);
    const serverTxnRef = params.get('txn') || '';
    const merchantCode = params.get('merchant_code') || TEST_MERCHANT_CODE;
    const payItemId = params.get('pay_item_id') || TEST_PAY_ITEM_ID;
    const paymentMode = params.get('mode') || 'TEST';
    const presetAmount = Number(params.get('amount'));

    const form = document.getElementById('paymentForm');
    const amountInput = document.getElementById('amount');
    const payButton = document.getElementById('payButton');
    const messageBox = document.getElementById('messageBox');
    const resultBox = document.getElementById('resultBox');

    let scriptReady = false;

    if (Number.isFinite(presetAmount) && presetAmount > 0) {
      amountInput.value = presetAmount.toFixed(2);
      amountInput.readOnly = true;
    }

    function showMessage(text, type = 'info') {
      messageBox.className = `alert ${type}`;
      messageBox.textContent = text;
      messageBox.style.display = 'block';
    }

    function hideMessage() {
      messageBox.style.display = 'none';
      messageBox.textContent = '';
    }

    function showResult(success, message) {
      resultBox.className = `alert ${success ? 'success' : 'failure'}`;
      resultBox.textContent = message;
      resultBox.style.display = 'block';
    }

    function showReturnButton() {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Return to VNC';
      button.addEventListener('click', () => {
        if (window.opener && !window.opener.closed) {
          window.opener.focus();
          window.close();
          window.setTimeout(() => {
            if (!window.closed) window.location.assign('/');
          }, 150);
          return;
        }

        window.location.assign('/');
      });
      resultBox.append(document.createElement('br'), button);
    }

    function hideResult() {
      resultBox.style.display = 'none';
      resultBox.innerHTML = '';
    }

    function toMinorUnit(naira) {
      return Math.round(naira * 100);
    }

    function loadInterswitchScript() {
      return new Promise((resolve, reject) => {
        if (typeof window.webpayCheckout === 'function') {
          scriptReady = true;
          resolve();
          return;
        }

        const script = document.createElement('script');
        script.src = ISW_SCRIPT_URL;
        script.async = true;

        script.onload = () => {
          if (typeof window.webpayCheckout === 'function') {
            scriptReady = true;
            resolve();
          } else {
            reject(new Error('Interswitch script loaded but webpayCheckout is not available.'));
          }
        };

        script.onerror = () => {
          if (typeof window.webpayCheckout === 'function') {
            scriptReady = true;
            resolve();
          } else {
            reject(new Error('Failed to load the Interswitch inline checkout script.'));
          }
        };

        document.body.appendChild(script);
      });
    }

    function notifyVnc(status, message) {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          { type: 'vnc-payment-verification', status, message },
          window.location.origin
        );
      }
    }

    async function paymentCallback(response) {
      console.log('ISW Payment Response:', response);
      payButton.disabled = false;
      payButton.textContent = 'Pay';

      const isSuccess = response && response.resp === '00';
      const responseCode = response && response.resp ? response.resp : 'N/A';
      const description = response && response.desc ? response.desc : 'No description returned';

      if (!isSuccess) {
        hideMessage();
        showResult(false, `Payment failed or cancelled.\nResponse code: ${responseCode}\n${description}`);
        showReturnButton();
        notifyVnc('failed', description);
        return;
      }

      if (!serverTxnRef) {
        const message = 'Interswitch reported approval, but this checkout has no VNC payment reference. No wallet credit was issued.';
        showResult(false, message);
        showReturnButton();
        notifyVnc('pending_verification', message);
        return;
      }

      showMessage('Payment approved by Interswitch. Verifying with VNC…', 'info');
      try {
        const token = localStorage.getItem('smartdata_token');
        if (!token) throw new Error('Your VNC session has expired. Sign in again to verify this payment.');

        const verificationResponse = await fetch('/api/payments/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ txn_ref: serverTxnRef }),
        });
        const verification = await verificationResponse.json().catch(() => ({}));
        if (!verificationResponse.ok) {
          throw new Error(verification.error || 'VNC could not verify this payment.');
        }

        const status = verification.status;
        if (!['approved', 'pending_verification', 'failed'].includes(status)) {
          throw new Error('VNC returned an unexpected payment verification result.');
        }
        const message = verification.message || (
          status === 'approved'
            ? 'Transaction successful. Your VNC balance has been updated.'
            : 'Interswitch has not confirmed this payment. No wallet credit was issued.'
        );
        hideMessage();
        showResult(status === 'approved', message);
        showReturnButton();
        notifyVnc(status, message);
      } catch (error) {
        const message = error.message || 'VNC could not verify this payment.';
        hideMessage();
        showResult(false, message);
        showReturnButton();
        notifyVnc('error', message);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();
      hideResult();

      const amount = parseFloat(amountInput.value);
      if (Number.isNaN(amount) || amount <= 0) {
        showMessage('Please enter a valid amount greater than zero.', 'failure');
        return;
      }

      payButton.disabled = true;
      payButton.textContent = 'Processing…';

      try {
        if (!scriptReady) {
          showMessage('Loading payment gateway, please wait…', 'info');
          await loadInterswitchScript();
          hideMessage();
        }

        const txnRef = serverTxnRef || `${merchantCode}-TRN-${Date.now()}-${Math.floor(
          Math.random() * 1000
        )}`;

        const paymentOptions = {
          merchant_code: merchantCode,
          pay_item_id: payItemId,
          txn_ref: txnRef,
          amount: toMinorUnit(amount),
          currency: TEST_CURRENCY,
          site_redirect_url: window.location.href,
          mode: paymentMode,
          onComplete: paymentCallback,
        };

        window.webpayCheckout(paymentOptions);
      } catch (error) {
        payButton.disabled = false;
        payButton.textContent = 'Pay';
        showMessage(error.message || 'Failed to start payment. Please try again.', 'failure');
      }
    });

    // Pre-load the Interswitch script as soon as the page loads so the user
    // doesn't have to wait when they click Pay.
    loadInterswitchScript().catch((error) => {
      console.warn('Could not pre-load Interswitch script:', error);
    });
  </script>
</body>

</html>
