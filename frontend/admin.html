<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VNC Administration</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{background:#eef3fa}.admin-shell{max-width:1100px;margin:auto;padding:24px}.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.admin-head .brand small{color:#77849b}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.admin-table{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;font-size:24px;margin-top:7px}.admin-table{margin-top:12px;overflow:auto}.admin-table table{width:100%;border-collapse:collapse;font-size:11px}.admin-table th{text-align:left;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}.admin-table td{padding:10px;border-bottom:1px solid #f1f4f8}.status-tag{padding:5px 8px;border-radius:20px;background:#edf3ff;color:#164baf}.login-box{max-width:380px;margin:15vh auto;background:#fff;border-radius:20px;padding:22px}.login-box img{width:54px;border-radius:14px}.login-box input{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;margin:8px 0}.login-box button{width:100%;height:46px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:800}@media(max-width:700px){.admin-shell{padding:14px}.metrics{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div id="loginView" class="login-box">
    <img src="/assets/vnc-logo.jpg" alt="VNC">
    <h2>Administration</h2>
    <input id="adminEmail" type="email" placeholder="Admin email" autocomplete="username">
    <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="adminLogin">Sign in</button>
  </div>
  <main id="adminView" class="admin-shell" hidden>
    <header class="admin-head">
      <div class="brand"><img src="/assets/vnc-logo.jpg" alt="VNC"><div><span>VNC</span><small>ADMINISTRATION</small></div></div>
      <button class="settings-row" style="width:auto;padding:0 14px" id="adminLogout">Sign out</button>
    </header>
    <section class="metrics">
      <div class="metric"><span>Total users</span><strong id="metricUsers">—</strong></div>
      <div class="metric"><span>Payment records</span><strong id="metricPayments">—</strong></div>
      <div class="metric"><span>Pending verification</span><strong id="metricPending">—</strong></div>
      <div class="metric"><span>Wallet ledger GB</span><strong id="metricBalance">—</strong></div>
    </section>
    <section class="admin-table">
      <h3>Recent payment activity</h3>
      <table><thead><tr><th>Reference</th><th>Customer</th><th>Amount</th><th>Mode</th><th>Status</th><th>Created</th></tr></thead><tbody id="paymentRows"></tbody></table>
    </section>
  </main>
  <script>
    let token=localStorage.getItem("smartdata_token");
    async function api(path,options={}){
      const headers={"Content-Type":"application/json",...(options.headers||{})};
      if(token)headers.Authorization="Bearer "+token;
      const response=await fetch(path,{...options,headers});
      const data=await response.json();
      if(!response.ok)throw new Error(data.error||"Request failed");
      return data;
    }
    async function loadOverview(){
      try{
        const data=await api("/api/admin/overview");
        document.getElementById("loginView").hidden=true;
        document.getElementById("adminView").hidden=false;
        document.getElementById("metricUsers").textContent=data.users;
        document.getElementById("metricPayments").textContent=data.payments;
        document.getElementById("metricPending").textContent=data.pending_verifications;
        document.getElementById("metricBalance").textContent=data.network_wallet_gb;
        document.getElementById("paymentRows").innerHTML=data.recent_payments.map(p=>`<tr><td>${p.txn_ref}</td><td>${p.name}<br>${p.email}</td><td>₦${(p.amount_kobo/100).toLocaleString("en-NG")}</td><td>${p.mode}</td><td><span class="status-tag">${p.status}</span></td><td>${p.created_at}</td></tr>`).join("")||'<tr><td colspan="6">No payment records</td></tr>';
      }catch(error){
        document.getElementById("loginView").hidden=false;
        document.getElementById("adminView").hidden=true;
        alert(error.message);
      }
    }
    document.getElementById("adminLogin").addEventListener("click",async()=>{
      try{
        const email=document.getElementById("adminEmail").value.trim();
        const password=document.getElementById("adminPassword").value;
        const result=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email,password})});
        token=result.token;localStorage.setItem("smartdata_token",token);await loadOverview();
      }catch(error){alert(error.message)}
    });
    document.getElementById("adminLogout").addEventListener("click",()=>{localStorage.removeItem("smartdata_token");location.reload()});
    if(token)loadOverview();
  </script>
</body>
</html>
